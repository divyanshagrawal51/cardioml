[project]
name = "cardioml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divyansh Agrawal", email = "divyashagrawal309@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
cardioml = "cardioml:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
